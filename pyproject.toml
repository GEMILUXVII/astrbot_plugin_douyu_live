[project]
name = "astrbot-plugin-douyu-live"
version = "2.2.14"
description = "An AstrBot plugin designed to monitor Douyu live streams and send real-time notifications."
readme = "README.md"
requires-python = ">=3.10"
# 注意：AstrBot 实际按 requirements.txt 安装依赖，此处仅为工具链声明，
# CI 会校验两处保持一致
# 上界锁次版本:插件耦合库的 0.x 细粒度语义(事件常量/异常继承/签名),
# 库发新次版本时插件跟发小版本抬上界
dependencies = ["aiodouyu>=0.4.10,<0.5"]

# 与 AstrBot 主仓库的 ruff 规则保持一致（插件单独 clone 时不再依赖宿主配置）
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
  "I",     # import-order
  "UP",    # pyupgrade
]
ignore = [
  "F403",
  "F405",
  "E501",
  "ASYNC230",
  "ASYNC240",
]
