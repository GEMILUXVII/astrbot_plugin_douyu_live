name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

env:
  ARCHIVE_PREFIX: astrbot_plugin_douyu_live

jobs:
  build-and-release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: prep
        env:
          # 输入经环境变量传递，避免直接内插进 shell（表达式注入面）
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            REF="refs/tags/${TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tag: $TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_PREFIX}-${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.prep.outputs.checkout_ref }}

      - name: Verify version consistency
        env:
          TAG: ${{ steps.prep.outputs.tag_name }}
        run: |
          META_VER="$(sed -n 's/^version:[[:space:]]*//p' metadata.yaml | tr -d '\"' | tr -d "'")"
          PY_VER="$(sed -n 's/^version = \"\(.*\)\"/\1/p' pyproject.toml | head -1)"
          echo "tag=${TAG} metadata=${META_VER} pyproject=${PY_VER}"
          if [ "v${META_VER}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match metadata.yaml version ${META_VER}" >&2
            exit 1
          fi
          if [ "${PY_VER}" != "${META_VER}" ]; then
            echo "pyproject.toml version ${PY_VER} does not match metadata.yaml ${META_VER}" >&2
            exit 1
          fi

      - name: Build release archive
        env:
          ARCHIVE_NAME: ${{ steps.prep.outputs.archive_name }}
        run: |
          zip -r "$ARCHIVE_NAME" . \
            -x ".git/*" \
            -x ".github/workflows/*" \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "tests/*" \
            -x "uv.lock"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: astrbot_plugin_douyu_live ${{ steps.prep.outputs.tag_name }}
          files: ${{ steps.prep.outputs.archive_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
