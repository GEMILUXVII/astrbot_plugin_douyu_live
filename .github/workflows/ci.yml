name: ci

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  lint-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -q

      - name: Check dependency declarations stay in sync
        if: matrix.python-version == '3.12'
        run: |
          python - <<'EOF'
          import tomllib
          import sys

          with open("pyproject.toml", "rb") as f:
              pyproject_deps = set(tomllib.load(f)["project"]["dependencies"])
          with open("requirements.txt", encoding="utf-8") as f:
              req_deps = {
                  line.strip()
                  for line in f
                  if line.strip() and not line.startswith("#")
              }
          if pyproject_deps != req_deps:
              print("requirements.txt 与 pyproject.toml 依赖声明不一致:", file=sys.stderr)
              print(f"  pyproject only: {pyproject_deps - req_deps}", file=sys.stderr)
              print(f"  requirements only: {req_deps - pyproject_deps}", file=sys.stderr)
              sys.exit(1)
          print("dependency declarations in sync")
          EOF
